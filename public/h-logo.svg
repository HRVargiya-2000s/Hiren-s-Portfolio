<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <defs>
    <linearGradient id="hGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8338ec;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background circle -->
  <circle cx="100" cy="100" r="100" fill="#08060b"/>
  
  <!-- Letter H with gradient -->
  <g filter="url(#glow)">
    <!-- Left vertical line of H -->
    <rect x="40" y="40" width="25" height="120" fill="url(#hGradient)" rx="4"/>
    
    <!-- Right vertical line of H -->
    <rect x="135" y="40" width="25" height="120" fill="url(#hGradient)" rx="4"/>
    
    <!-- Horizontal middle line of H -->
    <rect x="40" y="95" width="120" height="20" fill="url(#hGradient)" rx="4"/>
  </g>
  
  <!-- Border glow -->
  <circle cx="100" cy="100" r="100" fill="none" stroke="url(#hGradient)" stroke-width="2" opacity="0.6"/>
</svg>